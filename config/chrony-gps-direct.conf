# --- lora-gps: режим direct ------------------------------------------------
# NMEA-поток UART занят пакет-форвардером, chrony получает только PPS.
# PPS без опорного источника умеет привязаться к секунде лишь если системные
# часы уже точнее ±0.4 с, поэтому NTP-серверы из основного chrony.conf
# обязательно должны остаться включёнными.
refclock PPS /dev/pps0 refid GPPS poll 3 precision 1e-7 prefer

# Быстрая грубая коррекция при старте (иначе PPS никогда не захватится).
makestep 1.0 3
