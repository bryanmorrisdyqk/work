# --- lora-gps: режим gpsd --------------------------------------------------
# UART держит gpsd: NMEA -> SHM 0 (грубое время), PPS -> SHM 1 (точная секунда).
# Пакет-форвардер читает NMEA из псевдотерминала /dev/lora-gps (lora-gps-bridge).
refclock SHM 0 refid NMEA offset 0.200 precision 1e-3 poll 3 filter 3
refclock SHM 1 refid GPPS precision 1e-7 prefer

makestep 1.0 3
